<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F1F4F1">
<title>냉장고 비우기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
img{max-width:100%}
/* Layout: one calm column (max 560px), sticky summary up top, fixed three-tab bar at the bottom. Frost-white porcelain + deep pine, urgency in rust/amber. */
:root{
  --bg:#F1F4F1; --surface:#FFFFFF; --sunk:#E8EDE9; --ink:#17201C; --muted:#5C6962; --line:#D8DFDA;
  --accent:#2C5A4C; --accent-ink:#FFFFFF; --accent-soft:#E1EBE6;
  --over:#B0412D; --over-soft:#F5E1DA; --soon:#9E620C; --soon-soft:#F4E8D2; --ok:#4A7558;
  --shadow:0 1px 2px rgba(23,32,28,.05),0 6px 24px rgba(23,32,28,.06);
  --f-display:"Gowun Batang","Nanum Myeongjo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#18201C; --sunk:#141A17; --ink:#E6ECE8; --muted:#97A49D; --line:#28322D;
  --accent:#8EC3AF; --accent-ink:#0E1512; --accent-soft:#1E2D27;
  --over:#E68B75; --over-soft:#3A231D; --soon:#E0B56C; --soon-soft:#352A17; --ok:#8DBF9C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#18201C; --sunk:#141A17; --ink:#E6ECE8; --muted:#97A49D; --line:#28322D;
  --accent:#8EC3AF; --accent-ink:#0E1512; --accent-soft:#1E2D27;
  --over:#E68B75; --over-soft:#3A231D; --soon:#E0B56C; --soon-soft:#352A17; --ok:#8DBF9C;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25); color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:500}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px}
.top h1{font-size:28px;letter-spacing:-.01em}
.top .date{font-size:13px;color:var(--muted);text-align:right}

/* summary */
.summary{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);display:grid;gap:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{display:grid;gap:2px}
.stat b{font-family:var(--f-display);font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.stat.over b{color:var(--over)} .stat.soon b{color:var(--soon)}
.rail{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.cell{display:grid;justify-items:center;gap:6px;padding:8px 0 6px;border-radius:10px;background:var(--sunk)}
.cell .d{font-size:11px;color:var(--muted)}
.cell .dots{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;min-height:14px;max-width:34px}
.cell .dots i{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.cell.over .dots i{background:var(--over)} .cell.soon .dots i{background:var(--soon)}
.cell .c{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.cell.today{outline:1px solid var(--line);background:var(--surface)}
.saved{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}

/* sections */
section.view{display:grid;gap:20px;margin-top:20px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}
.sec-h h2{font-size:18px}
.sec-h small{color:var(--muted);font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* item list */
.list{display:grid;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.row:first-child{border-top:0}
.row:hover{background:var(--sunk)}
.row .nm{font-weight:600;min-width:0}
.row .nm small{font-weight:400;color:var(--muted);margin-left:6px;font-size:12px}
.row .meta{font-size:12px;color:var(--muted)}
.badge{font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
.badge.over{background:var(--over-soft);color:var(--over)}
.badge.soon{background:var(--soon-soft);color:var(--soon)}
.badge.old{background:transparent;border:1px solid var(--line);color:var(--muted)}
.tag-old{font-size:11px;color:var(--soon);border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:1px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:28px 20px;text-align:center;display:grid;gap:12px;justify-items:center;color:var(--muted)}
.empty h3{color:var(--ink);font-size:18px}
.banner{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--soon-soft);color:var(--soon);border-radius:12px;padding:10px 14px;font-size:13px;flex-wrap:wrap}
.banner button{background:none;border:0;color:inherit;text-decoration:underline;padding:0}

.btn{border:0;border-radius:12px;padding:11px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.line{background:none;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--over-soft);color:var(--over)}
.btn:disabled{opacity:.5;cursor:default}

/* add view */
.field{display:grid;gap:6px}
.field label,.lbl{font-size:12px;color:var(--muted);font-weight:500}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.ing{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 8px 10px;display:grid;gap:2px;justify-items:center;text-align:center;min-width:0}
.ing:hover{border-color:var(--accent)}
.ing .n{font-weight:600;font-size:14px;line-height:1.3;word-break:keep-all}
.ing .s{font-size:11px;color:var(--muted)}
.ing .have{position:absolute;top:6px;right:6px;font-size:10px;font-weight:600;background:var(--accent);color:var(--accent-ink);border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}
.ing.custom{border-style:dashed;color:var(--muted)}
.ing.mine{border-color:var(--accent);border-style:solid;background:var(--accent-soft)}
.sheet .chips .chip{padding:6px 11px}
.ingw{position:relative;display:grid;min-width:0}
.minus{position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:16px;line-height:1;display:grid;place-items:center;padding:0}
.minus:hover{color:var(--over);border-color:var(--over)}
.ing.pop{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(.94);background:var(--accent-soft)}}

/* recipes */
.ai{background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:18px;display:grid;gap:10px}
.ai h2{font-size:19px}
.ai p{margin:0;font-size:13px;opacity:.85}
.ai .btn{background:var(--accent-ink);color:var(--accent);justify-self:start}
.ai .row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ai .status{font-size:13px;opacity:.9}
.ai .stop{background:transparent;border:1px solid currentColor;color:inherit}
.cards{display:grid;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.card>button{all:unset;box-sizing:border-box;display:grid;gap:8px;padding:14px 16px;width:100%;cursor:pointer}
.card>button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.card .t{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card h3{font-size:18px}
.card .min{font-size:12px;color:var(--muted);white-space:nowrap}
.card .why{font-size:13px;color:var(--muted)}
.uses{display:flex;flex-wrap:wrap;gap:5px}
.u{font-size:12px;padding:3px 8px;border-radius:6px;background:var(--sunk)}
.u.over{background:var(--over-soft);color:var(--over)}
.u.soon{background:var(--soon-soft);color:var(--soon)}
.u.miss{background:none;border:1px dashed var(--line);color:var(--muted)}
.steps{margin:0;padding:0 16px 16px 34px;display:grid;gap:6px;font-size:14px}
.steps li::marker{color:var(--muted);font-variant-numeric:tabular-nums}
.note{font-size:12px;color:var(--muted)}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav.tabs button{border:0;background:none;padding:12px 0 14px;display:grid;justify-items:center;gap:3px;color:var(--muted);font-size:12px;font-weight:500}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"] span{font-weight:700}
.pill{display:inline-block;min-width:16px;font-size:10px;line-height:16px;border-radius:8px;background:var(--over);color:#fff;padding:0 4px;margin-left:3px;vertical-align:1px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,12,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px;max-height:90%;overflow:auto}
.sheet h2{font-size:20px}
.sheet input[type=text],.sheet input[type=date]{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:none;padding:9px 0;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.linkbtn{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;justify-self:center;padding:4px}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:13px;padding:10px 14px;border-radius:12px;z-index:50;max-width:calc(100% - 32px);display:flex;gap:12px;align-items:center}
.toast button{background:none;border:0;color:inherit;text-decoration:underline;padding:0;font-size:13px;white-space:nowrap}
.editbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--soon-soft);color:var(--soon);border-radius:12px;padding:10px 12px;font-size:13px}
.editbar .btn{padding:7px 14px}
.gridhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:-8px}
.gridhead .linkbtn{text-decoration:none;color:var(--accent);font-weight:600}
.ing.editing{border-style:dashed}
.ing.hid{opacity:.5}
.ing .pen{position:absolute;top:6px;right:8px;font-size:12px;color:var(--soon)}
.opt .k{font-size:15px}
/* banchan menu */
.seg.two{grid-template-columns:1fr 1fr}
.upl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.upl p{margin:0;font-size:13px;color:var(--muted);flex:1 1 200px}
.pv{max-height:280px;overflow:auto;font-size:13px;display:grid;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.pv b{font-family:var(--f-display)}
.dates{display:flex;gap:6px;flex-wrap:wrap}
.dchip{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 0;display:grid;justify-items:center;width:52px;font-size:11px;line-height:1.3}
.dchip b{font-size:17px;font-family:var(--f-display);font-variant-numeric:tabular-nums}
.dchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dchip.past:not([aria-pressed="true"]){color:var(--muted)}
.dchip .got{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.opt{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.opt:first-child{border-top:0}
.opt[aria-pressed="true"]{background:var(--accent-soft)}
.opt .k{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-weight:700;background:var(--sunk);font-family:var(--f-display)}
.opt[aria-pressed="true"] .k{background:var(--accent);color:var(--accent-ink)}
.opt .lb{font-size:11px;color:var(--muted)}
.opt .dn{font-weight:600;word-break:keep-all;min-width:0}
.opt .pr{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.star{color:var(--soon);font-size:11px;margin-left:4px;font-weight:500}
.got-tag{display:block;font-size:11px;color:var(--accent);font-weight:600}
.cta{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);flex-wrap:wrap}
.cta .sum{font-size:13px}
.cta .sum b{font-family:var(--f-display);font-size:17px}
@media (max-width:400px){.top h1{font-size:24px}.rail{gap:3px}.stat b{font-size:22px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="eyebrow">MY FRIDGE</div>
      <h1>냉장고 비우기</h1>
    </div>
    <div class="date" id="today"></div>
  </header>

  <div class="summary" id="summary"></div>

  <section class="view" id="v-fridge"></section>
  <section class="view" id="v-add" hidden></section>
  <section class="view" id="v-cook" hidden></section>
</div>

<nav class="tabs" aria-label="메뉴"><div class="in">
  <button data-tab="fridge" aria-current="page"><svg viewBox="0 0 24 24"><rect x="5" y="2.5" width="14" height="19" rx="2.5"/><path d="M5 9.5h14M8.5 5.5v2M8.5 12.5v3"/></svg><span>냉장고<b class="pill" id="pill" hidden></b></span></button>
  <button data-tab="add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>담기</span></button>
  <button data-tab="cook"><svg viewBox="0 0 24 24"><path d="M4 11h16v2a6 6 0 0 1-6 6h-4a6 6 0 0 1-6-6z"/><path d="M2.5 11h19M9 7c0-1.5 1-1.5 1-3M13 7c0-1.5 1-1.5 1-3"/></svg><span>요리 추천</span></button>
</div></nav>

<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<div id="sheetRoot"></div>

<script>
// ---------- data ----------
const CATS=[["veg","채소"],["meat","고기"],["sea","해산물"],["dairy","유제품·계란"],["proc","두부·가공"],["fruit","과일"]];
// id, name, cat, default days, storage
const INGS=[
["onion","양파","veg",30,"실온"],["pa","대파","veg",10],["potato","감자","veg",30,"실온"],["carrot","당근","veg",21],["zucchini","애호박","veg",7],["cabbage","양배추","veg",14],["napa","배추","veg",14],["radish","무","veg",14],["spinach","시금치","veg",4],["bean","콩나물","veg",3],["mung","숙주","veg",3],["oyster","느타리버섯","veg",5],["king","새송이버섯","veg",7],["shiitake","표고버섯","veg",7],["enoki","팽이버섯","veg",7],["perilla","깻잎","veg",5],["lettuce","상추","veg",5],["cucumber","오이","veg",7],["broccoli","브로콜리","veg",5],["paprika","파프리카","veg",10],["chili","청양고추","veg",10],["garlic","마늘","veg",30],["tomato","토마토","veg",7],["chive","부추","veg",4],["eggplant","가지","veg",7],["sweetpotato","고구마","veg",21,"실온"],
["pork","돼지고기(찌개·볶음)","meat",3],["samgyup","삼겹살","meat",3],["pork_m","다진 돼지고기","meat",2],["beef","소고기(불고기)","meat",3],["beef_soup","소고기(국거리)","meat",3],["chicken","닭(볶음탕용)","meat",2],["breast","닭가슴살","meat",2],["bacon","베이컨","meat",10],["ham","햄","meat",30],["sausage","소시지","meat",14],
["squid","오징어","sea",2],["shrimp","새우","sea",2],["mackerel","고등어","sea",2],["fishcake","어묵","sea",7],["clam","바지락","sea",2],["tuna","참치캔","sea",365,"실온"],
["egg","계란","dairy",21],["milk","우유","dairy",7],["cheese","슬라이스 치즈","dairy",30],["butter","버터","dairy",60],["cream","생크림","dairy",7],["yogurt","요거트","dairy",10],
["tofu","두부","proc",5],["softtofu","순두부","proc",5],["kimchi","김치","proc",60],["tteok","떡볶이떡","proc",5],["dumpling","냉동만두","proc",90,"냉동"],["rice","찬밥","proc",2],["bread","식빵","proc",5,"실온"],["pasta","파스타면","proc",365,"실온"],["ramen","라면","proc",180,"실온"],
["apple","사과","fruit",30],["banana","바나나","fruit",5,"실온"],["lemon","레몬","fruit",21],["strawberry","딸기","fruit",3]
].map(([id,name,cat,days,store])=>({id,name,cat,days,store:store||"냉장"}));
const ING=Object.fromEntries(INGS.map(i=>[i.id,i]));
const PORK=["pork","samgyup","pork_m"],BEEF=["beef","beef_soup"],MUSH=["oyster","king","shiitake","enoki"],HAMS=["ham","sausage","bacon"];
const PANTRY="간장·소금·설탕·식용유·참기름·후추·고춧가루·고추장·된장·밀가루";

// ---------- dates ----------
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return Date.UTC(y,m-1,d)};
const todayStr=()=>ymd(new Date());
const addDays=(s,n)=>{const t=new Date(parse(s)+n*864e5);return `${t.getUTCFullYear()}-${pad(t.getUTCMonth()+1)}-${pad(t.getUTCDate())}`};
const diff=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const WD="일월화수목금토";
const md=s=>{const t=new Date(parse(s));return `${t.getUTCMonth()+1}/${t.getUTCDate()}`};
const left=it=>diff(todayStr(),it.expires);
const age=it=>diff(it.bought,todayStr());
const level=d=>d<0?"over":d<=2?"soon":d<=6?"week":"ok";
const dLabel=d=>d<0?`${-d}일 지남`:d===0?"오늘까지":`D-${d}`;
const isOld=it=>age(it)>=7&&it.store!=="냉동";

// ---------- state & persistence ----------
let state={items:[],log:{}};
let db=null,uid=null,saveTimer=null,saving=Promise.resolve();
const LS="fridge-v1";
try{const raw=localStorage.getItem(LS);if(raw){const p=JSON.parse(raw);if(p&&Array.isArray(p.items))state=p}}catch(e){}
function persist(){
  try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}
  if(!db||!uid)return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{const body=JSON.parse(JSON.stringify(state));saving=saving.then(()=>db.doc(`data/users/${uid}/fridge`).set(body)).catch(()=>{})},700);

function setRcpt(p){Object.assign(rcpt,p);if(tab==="add"&&addMode==="rcpt")renderReceipt()}
function validDate(s){if(typeof s!=="string"||!/^\d{4}-\d{2}-\d{2}$/.test(s))return null;const dd=diff(s,todayStr());return dd>=0&&dd<=60?s:null}
async function readReceipt(file){
  setRcpt({busy:true,msg:"",rows:null,date:null,stage:"영수증을 읽는 중…"});
  try{
    if(CLAUDE_RT){
      const sample=await claude.use("sample");
      if(!sample)throw {code:"unavailable_here"};
      const lim=await sample.limits().catch(()=>null);if(!lim||!lim.images)throw {code:"unavailable_here"};
      const ctl=new AbortController();setRcpt({ctl});
      const names=allIngs().map(i=>i.name.replace(/\(.*\)/,"")).join(", ");
      const r=await sample.json(`이 이미지는 마트나 시장 영수증입니다. 오늘은 ${todayStr()}입니다.
냉장고에 넣을 식재료(채소, 과일, 고기, 해산물, 유제품, 계란, 두부, 김치, 면, 빵 등)만 고르세요. 세제, 봉투, 생활용품, 과자·음료 같은 것은 빼세요.
name은 냉장고에 적을 짧은 재료 이름이에요. 가능하면 다음 이름 중 하나를 그대로 쓰세요: ${names}
JSON만 답하세요: {"date":"영수증 구매일 YYYY-MM-DD 또는 null","items":[{"raw":"영수증에 적힌 상품명","name":"재료 이름","qty":수량}]}`,{images:file,signal:ctl.signal,cache:false});
      const items=r&&Array.isArray(r.items)?r.items.filter(x=>x&&(x.name||x.raw)):[];
      setRcpt({busy:false,ctl:null,rows:items.map(x=>rowFrom(x.raw,x.name||x.raw,x.qty)).map(r=>({...r,on:true})),date:validDate(r&&r.date)});
    }else{
      if(!window.Tesseract){setRcpt({stage:"글자 인식 도구를 불러오는 중…"});await new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";s.onload=ok;s.onerror=()=>no({code:"load_failed"});document.head.append(s)})}
      setRcpt({stage:"글자 인식 데이터를 받는 중… (처음 한 번만)"});
      const worker=await Tesseract.createWorker("kor",1,{logger:m=>{if(m.status==="recognizing text")setRcpt({stage:`영수증 읽는 중… ${Math.round(m.progress*100)}%`})}});
      const {data}=await worker.recognize(file);await worker.terminate();
      const text=data&&data.text||"";
      const dm=text.match(/(20\d{2})[.\-\/년 ]\s*(\d{1,2})[.\-\/월 ]\s*(\d{1,2})/);
      const date=dm?validDate(`${dm[1]}-${pad(+dm[2])}-${pad(+dm[3])}`):null;
      const rows=[],seen=new Set();
      for(const line of text.split(/\n/)){
        if(RCPT_SKIP.test(line))continue;
        const clean=line.replace(/[0-9,.*#@\-_=+:;'"()\[\]{}<>|\/\\%₩원]+/g," ").replace(/\b[a-zA-Z]{1,2}\b/g," ").replace(/\s+/g," ").trim();

        const r=rowFrom(clean,clean,1);

      }

    }
  }catch(e){
    const M={cancelled:"",unavailable_here:"이 화면에서는 사진을 읽을 수 없어요.",not_granted:"Claude 사용을 허용하지 않아 사진을 읽을 수 없어요.",image_rejected:"이 사진은 읽을 수 없어요. JPG나 PNG로 다시 골라 주세요.",rate_limited:"요청이 많아요. 잠시 뒤 다시 해 주세요.",invalid_json:"영수증을 읽지 못했어요. 다시 찍어 주세요.",load_failed:"글자 인식 도구를 불러오지 못했어요. 인터넷 연결을 확인해 주세요."};
    setRcpt({busy:false,ctl:null,msg:(e&&e.code in M)?M[e.code]:"영수증을 읽지 못했어요. 다시 해 주세요."});
  }
}

function bindMenu(v){

    const M=menus.months[month];M.days=M.days.filter(d=>d.date!==date);M.days.push({date,items});M.days.sort((a,b)=>a.date<b.date?-1:1);

function normalizeMenu(r){
  if(!r||typeof r!=="object"||!/^\d{4}-\d{2}$/.test(r.month)||!Array.isArray(r.days))return null;
  const slots=Array.isArray(r.slots)&&r.slots.length?r.slots.filter(s=>s&&s.key).map(s=>({key:String(s.key).toUpperCase(),label:String(s.label||""),price:Number(s.price)||0})):SLOT_DEF;
  const days=r.days.filter(d=>d&&/^\d{4}-\d{2}-\d{2}$/.test(d.date)&&d.items&&typeof d.items==="object").map(d=>{const items={};for(const [k,v] of Object.entries(d.items))if(v&&String(v).trim())items[String(k).toUpperCase()]=String(v).trim();return {date:d.date,items}}).filter(d=>Object.keys(d.items).length);
  if(!days.length)return null;
  const always=Array.isArray(r.always)?r.always.filter(a=>a&&(a.name||typeof a==="string")).map(a=>typeof a==="string"?{name:a,price:0}:{name:String(a.name),price:Number(a.price)||0}):[];
  return {vendor:String(r.vendor||"").slice(0,30),month:r.month,slots,always,days};
}
async function parseMenu(file){

가격 안내가 있으면 구분별 가격을 숫자(원)로, 매일 고를 수 있는 상시메뉴가 있으면 always에 넣으세요.
JSON만 답하세요:
{"vendor":"업체 이름(짧게)","month":"YYYY-MM","slots":[{"key":"A","label":"고기해물","price":6500}],"always":[{"name":"곰탕","price":8000}],"days":[{"date":"YYYY-MM-DD","items":{"A":"반찬명","B":"반찬명"}}]}`;
  try{
    const r=await sample.json(prompt,{images:file,signal:ctl.signal,cache:false});

  }catch(e){

    parseState={busy:false,msg:(e&&e.code in M)?M[e.code]:"연결이 끊겼어요. 다시 올려 주세요.",ctl:null};
  }
  if(tab==="add"&&addMode==="menu")renderMenu();
}

// ---------- recipes ----------
function weight(it){const d=left(it),a=age(it);let w=d<=1?10:d===2?7:d===3?5:d<=5?3:d<=7?2:1;if(a>=10)w+=2;else if(a>=5)w+=1;return w}
function recommend(){
  const avail=state.items.filter(i=>left(i)>=0);
  const best={};
  for(const it of avail){if(it.kind==="banchan")continue;let k=it.key||matchKey(it.name);if(k&&k.startsWith("c_"))k=matchKey(it.name);if(!k)continue;if(!best[k]||left(it)<left(best[k]))best[k]=it}
  const pick=g=>{let b=null;for(const k of g){const it=best[k];if(it&&(!b||left(it)<left(b)))b=it}return b};
  const full=[],near=[];
  for(const r of RECIPES){
    const used=[],missing=[];
    for(const g of r.req){const it=pick(g);if(it)used.push(it);else missing.push(g)}
    if(missing.length>1)continue;
    for(const o of r.opt){const it=pick(Array.isArray(o)?o:[o]);if(it&&!used.includes(it))used.push(it)}
    const score=used.reduce((s,it)=>s+weight(it),0);
    const urgent=used.some(it=>left(it)<=3||isOld(it));
    const rec={r,used,missing,score,urgent};
    if(!missing.length)full.push(rec);else if(urgent)near.push(rec);
  }
  full.sort((a,b)=>b.score-a.score);near.sort((a,b)=>b.score-a.score);
  return {full,near:near.slice(0,5)};
}
function useChip(it){const d=left(it),lv=level(d);const cls=lv==="over"?"over":lv==="soon"?"soon":"";const extra=d<=3?` ${dLabel(d)}`:isOld(it)?` ${age(it)}일째`:"";return `<span class="u ${cls}">${esc(it.name.replace(/\(.*\)/,""))}${extra}</span>`}
function cardHTML(x,idx){
  const id="r"+idx;const open=openCard===x.r.n;
  const miss=x.missing.map(g=>`<span class="u miss">+ ${esc(g.map(k=>ING[k].name.replace(/\(.*\)/,"")).join("/"))}</span>`).join("");
  return `<div class="card"><button aria-expanded="${open}" aria-controls="${id}" data-card="${esc(x.r.n)}">
    <div class="t"><h3>${esc(x.r.n)}</h3><span class="min">${x.r.t}분</span></div>
    <div class="uses">${x.used.map(useChip).join("")}${miss}</div></button>
    <ol class="steps" id="${id}" ${open?"":"hidden"}>${x.r.s.map(s=>`<li>${esc(s)}</li>`).join("")}</ol></div>`;
}

단계는 3~5개, 각 단계는 한 문장으로 짧게 쓰세요.`;

      <div class="field"><label for="f-e">소비기한</label><input type="date" id="f-e" value="${draft.expires}"></div></div>
      <div class="chips"><button class="chip" data-plus="1">+1일</button><button class="chip" data-plus="3">+3일</button><button class="chip" data-plus="7">+7일</button></div>
      <div class="field"><span class="lbl">보관</span><div class="seg">${["냉장","냉동","실온"].map(s=>`<button data-s="${s}" aria-pressed="${draft.store===s}">${s}</button>`).join("")}</div></div>
      <button class="btn" id="save">저장</button>
      <div class="acts"><button class="btn ghost" id="ate">다 먹었어요</button><button class="btn danger" id="toss">버렸어요</button></div>
      <button class="linkbtn" id="del">잘못 넣었어요 (기록 없이 삭제)</button>
    </div></div>`;
    const sync=()=>{draft.name=$("#f-name").value.trim()||it.name;draft.bought=$("#f-b").value||draft.bought;draft.expires=$("#f-e").value||draft.expires};
    $("#scrim").onclick=e=>{if(e.target.id==="scrim")close()};
    root.querySelectorAll("[data-plus]").forEach(b=>b.onclick=()=>{sync();draft.expires=addDays(draft.expires,+b.dataset.plus);draw()});
    root.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{sync();const was=draft.store;draft.store=b.dataset.s;
      if(was!=="냉동"&&draft.store==="냉동"){const base=left(draft)<0?todayStr():draft.expires;draft.expires=addDays(base,30)}draw()});
    $("#f-e").onchange=()=>{sync();draw()};
    $("#save").onclick=()=>{sync();Object.assign(it,draft);if(it.kind!=="banchan"&&!(it.key||"").startsWith("c_")){const k=matchKey(it.name);if(k)it.key=k}close();commit();toast("저장했어요")};
    const out=kind=>{const snap=JSON.parse(JSON.stringify(state));state.items=state.items.filter(i=>i.id!==id);if(kind)logOut(kind);close();commit();
      toast(kind==="eaten"?`${it.name} 다 먹음`:kind==="tossed"?`${it.name} 버림`:`${it.name} 삭제`,()=>{state=snap;commit()})};
    $("#ate").onclick=()=>out("eaten");$("#toss").onclick=()=>out("tossed");$("#del").onclick=()=>out(null);
  };
  const onKey=e=>{if(e.key==="Escape")close()};
  const close=()=>{root.innerHTML="";document.removeEventListener("keydown",onKey)};
  document.addEventListener("keydown",onKey);
  draw();$("#save").focus();
}

// ---------- tabs ----------
function setTab(t){tab=t;document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-current",b.dataset.tab===t?"page":"false"));
  ["fridge","add","cook"].forEach(k=>$("#v-"+k).hidden=k!==t);render();window.scrollTo(0,0)}
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
function render(){renderSummary();if(tab==="fridge")renderFridge();if(tab==="add")renderAdd();if(tab==="cook")renderCook()}
render();
</script>
